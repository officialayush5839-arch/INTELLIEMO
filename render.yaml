services:
  # ==========================================
  # INTELLIEMO Backend Web Service
  # ==========================================
  - type: web
    name: intelliemo-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt && python scripts/download_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: DEBUG
        value: "false"
      - key: APP_ENV
        value: "production"

  # ==========================================
  # INTELLIEMO Frontend Static Site
  # ==========================================
  - type: web
    name: intelliemo-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: intelliemo-backend
          envVarKey: RENDER_EXTERNAL_URL
